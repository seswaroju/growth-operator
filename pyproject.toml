[project]
name = "growth-operator"
version = "0.1.0"
description = "Growth Operator platform — vertical-agnostic SMB agent OS"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "redis>=5.2",
    "httpx>=0.28",
    "cel-python>=0.2",
    "python-jose[cryptography]>=3.3",
    "argon2-cffi>=23.1",
    "opentelemetry-sdk>=1.28",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    # asyncpg/redis/httpx instrumentation deferred until a tracing backend exists (MVP-006
    # follow-up, TODO.md) — telemetry._instrument() imports them lazily/guarded, so adding
    # the packages back is all that's needed to activate them.
    "opentelemetry-exporter-otlp>=1.28",
    "pyyaml>=6.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers[postgres,redis]>=4.9",
    "schemathesis>=3.39",
    "ruff>=0.8",
    "mypy>=1.13",
    "types-pyyaml>=6.0",
    "pre-commit>=4.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

# FastAPI's dependency-injection idiom puts `Depends(...)`/`Query(...)` in argument
# defaults on purpose; exempt them from flake8-bugbear B008.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
exclude = ["verticals/", "tests/"]

# python-jose ships no type stubs; the JWT surface we use is small and wrapped in
# core/tenancy/auth.py.
[[tool.mypy.overrides]]
module = "jose.*"
ignore_missing_imports = true

# OpenTelemetry contrib instrumentation packages ship incomplete stubs.
[[tool.mypy.overrides]]
module = "opentelemetry.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# importlib mode lets unit/ and integration/ hold same-named files (e.g. test_health.py)
# without module-name collisions, and needs no __init__.py in the test tree.
addopts = "--import-mode=importlib"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core"]
