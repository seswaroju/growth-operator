# Reference install for CI (MVP-041). A fresh org installing 'jewelry' with this config must
# produce exactly the expected_result below. The e2e test (tests/e2e/test_jewelry_install.py)
# asserts each field. `indexes_queued` lands with MVP-042 (index generation) — not asserted
# yet; policies are seeded (MVP-044), workflows seeding stays deferred until migration 016.
pack_ref: jewelry
config:
  making_charge_pct: 12
  making_min_minor: 50000
  wastage_pct: 2
  discount_ceiling_pct: 5
  quote_validity_hours: 24
  store_visit_slots: "Mon-Sat 10:00-20:00"
expected_result:
  status: active
  instances_paused: 4          # concierge, nurture, campaigner, ops (support archetype unseeded)
  catalog_schema_version: 2
  prompt_layers_candidate: 9    # 4 concierge + 1 campaigner + 1 nurture + 2 ops + 1 support
  bindings: 4
  deferred_steps: [workflows]
  # indexes_queued: 3           # pending MVP-042
