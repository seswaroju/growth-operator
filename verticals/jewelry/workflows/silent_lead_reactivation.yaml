# Silent-lead (ghost) recovery — diagnosis-first (jewelry pack, MVP-073i).
# v3 (PROPOSED shorthand) -> v4: rewritten to the frozen grammar + Option-A sugar (DECISIONS
# 2026-08-09), so it PARSES, COMPILES, and RUNS gated-simulated. See
# docs/32-jewelry-mvp-playbooks/reason-conditioned-recovery-spec.md + 10-agents/ghost-diagnosis-prompt.md.
#
# Deferred to the CAPTURE-GAP migrations (needs data today's schema lacks; then re-enable):
#   - classify_ghost (ghost vs shop-stopped-replying) — needs last_outbound_msg_at (CAPTURE-GAP-04);
#   - the 24h post-quote silence window in the trigger — needs last_customer_msg_at (GAP-05);
#   - the sales-handoff branch + writing the owner's pick to lead_diagnoses (GAP-06).
# The diagnosis + reason-conditioned recovery + approval gate all run today.
workflow: silent_lead_reactivation
version: 4
trigger:
  event: {type: lead.stage.changed, condition: "payload.stage == 'quoted'"}
# Block style so YAML does not split the comma inside touch_cap(3, 30d).
guards:
  - consent_valid(marketing)
  - not_suppressed
  - within_send_window
  - touch_cap(3, 30d)
concurrency: {key: "subject.lead_id", policy: drop}
steps:
  # Diagnosis (frontier tier) — ranked distribution over the 8 reasons + abstain. Output binds under
  # `diagnose` so the gate + composer read `diagnose.ranked` / `diagnose.top_reason`.
  - diagnose:
      archetype: nurture
      task: ghost_diagnosis
      tier: frontier
      timeout: 30s
      input_map: {thread: "subject.pre_silence_thread", sku: "subject.quoted_catalog_item"}
      output: [top_reason, ranked, abstain, confidence_top, recommended_action_id]
  # Nothing sends autonomously (audit-before-act): confident -> the recommended action; abstain ->
  # the owner picks from the ranked options, or declines. The pick becomes the ground-truth label.
  - approval_gate:
      options_from: "diagnose.ranked"
      recommended: "diagnose.recommended_action_id"
      allow_owner_handle: true
      label_sink: lead_diagnoses
  # Compose the reason-conditioned template; {{ledger.*}} placeholders fill on the send path.
  - compose:
      archetype: nurture
      task: reason_conditioned_recovery
      timeout: 2m
      input_map: {action: "diagnose.recommended_action_id", reason: "diagnose.top_reason"}
  - wait: {for: reply, timeout: 96h}
  - branch:
      cases:
        - when: "wait.result == 'reply'"
          steps:
            - emit: {event: lead.reengaged,
                     payload_map: {lead_id: "subject.lead_id", reason: "diagnose.top_reason"}}
      default: []   # touch_cap governs re-entry; no explicit loop
compensation:
  on_failure:
    - set: {vars: {recovery_failed: true}}
  alert: ops_digest
