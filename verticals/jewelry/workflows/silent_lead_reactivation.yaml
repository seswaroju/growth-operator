# Silent-lead (ghost) recovery — the complete vertical slice (jewelry pack).
#
# v5 (PILOT-1C): this playbook now actually sends. v4 diagnosed the ghost, asked the owner to
# decide, composed a message — and then waited 96 hours for a reply to something nobody had sent.
# Every step existed except the one that reaches the customer, so the workflow could complete
# "successfully" having done nothing. The `tool_call` step closes that gap.
#
# What the platform guarantees around this file, so that reading it is not the safety argument:
#   - Naming a tool here grants nothing. The manifest, the acting agent's execution authority, the
#     tool's capability gate, rate limits, budgets and the tier engine all apply inside mediation.
#   - The acting principal is derived from THIS workflow's persisted identity, not from anything
#     written below. A copy of this file installed as an owner-built workflow resolves no principal.
#   - `{const:}` values are pack-authored constants. No model chooses the template.
#   - An unresolved `input_map` reference fails the step. It never silently sends a literal.
#
# See docs/32-jewelry-mvp-playbooks/reason-conditioned-recovery-spec.md +
#     docs/10-agents/ghost-diagnosis-prompt.md
#
# Recovery starts when SILENCE IS DETECTED, not when the quote goes out, so a lead that replies and
# goes quiet again re-enters as a new episode (GHOST-1b). A customer waiting on the STORE is never
# chased — `core/customers/recovery.classify` tells the owner instead. Owner overrides
# (exclude / snooze / resume) are enforced by that same classifier (GHOST-1c).
workflow: silent_lead_reactivation
version: 5
trigger:
  event: {type: lead.went_silent.v1, condition: "payload.stage == 'quoted'"}
# Block style so YAML does not split the comma inside touch_cap(3, 30d).
guards:
  - consent_valid(marketing)
  - not_suppressed
  - within_send_window
  - touch_cap(3, 30d)
concurrency: {key: "subject.lead_id", policy: drop}
steps:
  # 1. Diagnosis (frontier tier). Non-effectful: reads the pre-silence thread, returns a ranked
  # distribution over the pack's declared reasons. Output binds under `diagnose`, and a reason the
  # model invented never survives validation against verticals/jewelry/agents/ghost_reasons.yaml.
  - diagnose:
      archetype: nurture
      task: ghost_diagnosis
      tier: frontier
      timeout: 30s
      input_map: {thread: "subject.pre_silence_thread", sku: "subject.quoted_catalog_item"}
      output: [top_reason, ranked, abstain, confidence_top, recommended_action_id]

  # 2. Nothing sends autonomously. Confident → the recommended action; abstain → the owner picks
  # from the ranked options, or declines with "I'll handle it". The pick is written to
  # `lead_diagnoses` as the ground-truth label — the owner knows this customer and we do not.
  - approval_gate:
      options_from: "diagnose.ranked"
      recommended: "diagnose.recommended_action_id"
      allow_owner_handle: true
      label_sink: lead_diagnoses

  # 3. The send. One deterministic approved template for the pilot: the diagnosis decides whether
  # to reach out and what the owner is told, not what the customer reads. Reason-conditioned copy
  # is a later ticket, and shipping the label first means the owner's picks accumulate as training
  # data before any generated copy exists.
  #
  # `idempotency_key` is derived from the silence episode, so a redelivered event, a re-sweep and a
  # second worker all compute the same key and the durable pre-dispatch claim collapses them into
  # exactly one message. `recovery_attempt_id` ties the provider's answer back to the attempt row,
  # which is what makes "sent", "delivered" and "replied" separate, provable facts.
  - tool_call:
      name: messages.send
      output_as: send
      timeout: 60s
      input_map:
        conversation_id: "subject.conversation_id"
        recovery_attempt_id: "subject.recovery_attempt_id"
        idempotency_key: "subject.idempotency_key"
        template_key: {const: pilot_recovery_check_in}
        template_language: {const: en}
        template_parameters: "subject.template_parameters"
        message_class: {const: marketing}

  # 4. Did they come back? The wait is registered against the conversation resolved at start; the
  # reply itself is credited to this attempt by `core/customers/recovery_consumer`, which requires
  # the reply to have arrived AFTER the send.
  - wait: {for: reply, timeout: 96h}
  - branch:
      cases:
        - when: "wait.result == 'reply'"
          steps:
            - emit: {event: lead.reengaged,
                     payload_map: {lead_id: "subject.lead_id", reason: "diagnose.top_reason"}}
      default: []   # touch_cap governs re-entry; no explicit loop
compensation:
  on_failure:
    - set: {vars: {recovery_failed: true}}
  alert: ops_digest
