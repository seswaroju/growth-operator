# Silent-lead (ghost) recovery — diagnosis-first (jewelry pack, MVP-073i).
# v3 (PROPOSED shorthand) -> v4: rewritten to the frozen grammar + Option-A sugar (DECISIONS
# 2026-08-09), so it PARSES, COMPILES, and RUNS gated-simulated. See
# docs/32-jewelry-mvp-playbooks/reason-conditioned-recovery-spec.md + 10-agents/ghost-diagnosis-prompt.md.
#
# CAPTURE-GAP status (refreshed 2026-08-12 — the gaps this header used to defer are closed):
#   - ghost vs shop-stopped-replying: DONE, deterministically, in `core/customers/recovery.classify`
#     (GHOST-1b). A customer who spoke last and was never answered is `shop_stopped_replying` — the
#     OWNER is told and the customer is never chased. The spec's `classify_ghost` agent step was
#     dropped in favour of facts (DECISIONS 2026-08-12): no model call to compare two timestamps.
#   - the silence window: DONE and improved (GHOST-1b). Not a fixed 24h post-quote dwell but an
#     owner-configurable threshold (`recovery.silence_hours`, default 72) measured from the
#     CUSTOMER's last message, so a lead that replies and goes quiet again re-enters recovery.
#   - the owner's pick → `lead_diagnoses`: DONE (the approval_gate's `label_sink` below).
#   - STILL OPEN (enhancement, not a blocker): the sales-handoff branch — escalating a high-value or
#     repeatedly-unrecovered lead to a named human salesperson instead of another message.
# Owner overrides (exclude / snooze / contacted / resume) are enforced by the same classifier (GHOST-1c).
workflow: silent_lead_reactivation
version: 4
# GHOST-1b: recovery starts when SILENCE IS DETECTED, not when the quote goes out — a lead that
# replies and then goes quiet again must be able to re-enter. `core/customers/recovery` sweeps daily,
# classifies each engaged lead from facts (who spoke last + how long since the customer's last
# message, threshold = the store's `recovery.silence_hours`, default 72), and emits this event only
# for genuine ghosts. A customer who is waiting on the STORE is never chased — the owner is told
# instead. (GHOST-1a's `lead.stage_changed.v1` remains the lifecycle signal that makes a lead a
# recovery candidate; it no longer starts the playbook directly.)
trigger:
  event: {type: lead.went_silent.v1, condition: "payload.stage == 'quoted'"}
# Block style so YAML does not split the comma inside touch_cap(3, 30d).
guards:
  - consent_valid(marketing)
  - not_suppressed
  - within_send_window
  - touch_cap(3, 30d)
concurrency: {key: "subject.lead_id", policy: drop}
steps:
  # Diagnosis (frontier tier) — ranked distribution over the 8 reasons + abstain. Output binds under
  # `diagnose` so the gate + composer read `diagnose.ranked` / `diagnose.top_reason`.
  - diagnose:
      archetype: nurture
      task: ghost_diagnosis
      tier: frontier
      timeout: 30s
      input_map: {thread: "subject.pre_silence_thread", sku: "subject.quoted_catalog_item"}
      output: [top_reason, ranked, abstain, confidence_top, recommended_action_id]
  # Nothing sends autonomously (audit-before-act): confident -> the recommended action; abstain ->
  # the owner picks from the ranked options, or declines. The pick becomes the ground-truth label.
  - approval_gate:
      options_from: "diagnose.ranked"
      recommended: "diagnose.recommended_action_id"
      allow_owner_handle: true
      label_sink: lead_diagnoses
  # Compose the reason-conditioned template; {{ledger.*}} placeholders fill on the send path.
  - compose:
      archetype: nurture
      task: reason_conditioned_recovery
      timeout: 2m
      input_map: {action: "diagnose.recommended_action_id", reason: "diagnose.top_reason"}
  - wait: {for: reply, timeout: 96h}
  - branch:
      cases:
        - when: "wait.result == 'reply'"
          steps:
            - emit: {event: lead.reengaged,
                     payload_map: {lead_id: "subject.lead_id", reason: "diagnose.top_reason"}}
      default: []   # touch_cap governs re-entry; no explicit loop
compensation:
  on_failure:
    - set: {vars: {recovery_failed: true}}
  alert: ops_digest
