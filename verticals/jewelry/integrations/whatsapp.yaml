integration: whatsapp_business
mcp_server: go-whatsapp
credential_schema:
  type: object
  properties: {waba_id: {type: string}, phone_number_id: {type: string}, access_token: {type: string, x-secret: true}}
  required: [waba_id, phone_number_id, access_token]
scopes: [messages.send, messages.receive, templates.manage, media.upload]
health_check: {kind: api_probe, endpoint: phone_number_status, interval: 5m, degraded_after_failures: 3}
templates_namespace: jewelry_v2
quality_rating_monitor: {poll: 1h, on_yellow: pause_campaigns, on_red: pause_all_marketing_and_alert}
