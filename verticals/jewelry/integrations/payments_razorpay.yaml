integration: razorpay_links
mcp_server: go-billing-razorpay
credential_schema:
  type: object
  properties: {key_id: {type: string}, key_secret: {type: string, x-secret: true}}
  required: [key_id, key_secret]
scopes: [payment_links.create, payment_links.read]      # NOTE: no charge/refund scopes — tier-4 actions stay human
health_check: {kind: api_probe, endpoint: ping, interval: 15m}
usage: {advance_booking_pct_slot: deposit_pct, link_expiry_hours: 48}
