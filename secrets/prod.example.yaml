# PRODUCTION SECRET SCHEMA — EXAMPLE ONLY. Every value below is a placeholder and safe to commit.
#
# Copy to a plaintext file, replace every value, `sops --encrypt` it to secrets/prod.enc.yaml, and
# delete the plaintext. The keys map to GROWTH_OPERATOR_* settings without the prefix.
#
# Outside dev the application refuses to boot when any of these is still the repository's published
# development default (core/common/safety.py) — so a forgotten value is a failed deploy, never a
# quietly compromised one. That refusal is the reason this file lists the *names* and nothing else.
#
# Only what the pilot actually enables is required. Disabled providers need no secret, and adding
# one "just in case" widens the blast radius of a leak for no benefit.

# ---- REQUIRED: cryptographic identity -----------------------------------------------------
# Generate each independently. Reusing one value across two purposes means one leak compromises
# both, and these protect different things: sessions, stored WABA tokens, execution tokens, packs.
#   jwt_secret:                     openssl rand -base64 48
#   credential_encryption_key:      python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
#   execution_token_signing_seed:   openssl rand -base64 32
#   manifest_signing_seed:          openssl rand -base64 32
jwt_secret: "REPLACE-generate-with-openssl-rand-base64-48"
credential_encryption_key: "REPLACE-generate-a-valid-fernet-key"
execution_token_signing_seed: "REPLACE-generate-32-random-bytes-base64"
manifest_signing_seed: "REPLACE-generate-32-random-bytes-base64"

# ---- REQUIRED: data services --------------------------------------------------------------
# Two roles, deliberately. `app_rw` is NOBYPASSRLS and holds no DDL rights, so tenant isolation is
# enforced by Postgres itself rather than by application discipline; the owner URL is used only by
# `alembic upgrade` during deploy. Never point database_url at the owner to make something work.
database_url: "postgresql+asyncpg://app_rw:REPLACE@postgres:5432/growth_operator"
database_migrator_url: "postgresql+asyncpg://growth_operator:REPLACE@postgres:5432/growth_operator"
# Redis is unpublished AND authenticated — it carries the event streams, so write access is the
# ability to forge or drop work.
redis_url: "redis://:REPLACE@redis:6379/0"

# ---- REQUIRED: Meta / WhatsApp ------------------------------------------------------------
# From the Meta app. `whatsapp_app_secret` verifies the HMAC on every inbound webhook — with the
# published default, forged inbound messages are indistinguishable from real ones.
# `whatsapp_verify_token` is any long random string; it must match what is typed into Meta.
whatsapp_app_secret: "REPLACE-from-meta-app-settings"
whatsapp_verify_token: "REPLACE-any-long-random-string-also-entered-in-meta"

# ---- REQUIRED: owner login (email OTP) ----------------------------------------------------
# Startup fails if otp_email_enabled is true and any of these is missing, because the alternative
# is a merchant who cannot log in and no explanation.
smtp_host: "REPLACE.smtp.provider.com"
smtp_port: 587
smtp_username: "REPLACE"
smtp_password: "REPLACE"
smtp_from: "no-reply@vaylorn.com"

# ---- REQUIRED: at least one LLM provider --------------------------------------------------
# One is enough to run the pilot; a second proves cross-provider fallback is real rather than
# configured. Only include the providers actually in use.
llm_key_deepseek: "REPLACE-or-omit"
# llm_key_openai: "REPLACE-or-omit"
# llm_key_anthropic: "REPLACE-or-omit"

# ---- REQUIRED: object storage (catalog product images) -------------------------------------
# MinIO on the same droplet, on the internal Docker network — no extra service, nothing paid, and
# no public port. Durable storage is mandatory outside dev: the in-process fallback would serve an
# image uploaded to one uvicorn worker and 404 from the other, and lose everything on restart.
#
# These two also become MINIO_ROOT_USER / MINIO_ROOT_PASSWORD in the host environment. Generate a
# real password — `openssl rand -base64 32` — and never the vendor defaults, which are published in
# every MinIO tutorial on the internet.
s3_access_key: "REPLACE-strong-minio-user"
s3_secret_key: "REPLACE-generate-with-openssl-rand-base64-32"
s3_bucket: "vaylorn-media"

# ---- OPTIONAL: only when the corresponding feature is enabled ------------------------------
#
# Error tracking — the app is inert without a DSN, so omit it until GlitchTip/Sentry exists.
# error_tracking_dsn: "REPLACE"
#
# Payments stay OFF for the pilot: razorpay_live_enabled=false moves no money. Do not add keys
# here before that is a deliberate decision.
