# Local, self-hosted GlitchTip — error-tracking dashboard for security S2 (audit #16d).
#
# Standalone stack (its OWN postgres + redis, separate from the app's dev DB) so error data never
# mixes with application data. Runs on host port 8888 to avoid clashing with the app's 8000.
#
#   docker compose -f infra/docker/docker-compose.glitchtip.yml up -d   (or: make glitchtip)
#
# Then follow infra/docker/GLITCHTIP.md to create a user + project and copy the DSN into
# GROWTH_OPERATOR_ERROR_TRACKING_DSN (backend) and web/.env VITE_ERROR_DSN (frontend).
#
# This is a DEV-ONLY convenience so you can see the dashboard UX. For a real cloud deployment, pin
# a specific image version and set a strong SECRET_KEY via secrets (never a literal in this file).

name: growth-operator-glitchtip

x-environment: &gt-env
  DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-postgres:5432/glitchtip
  SECRET_KEY: ${GLITCHTIP_SECRET_KEY:-dev-insecure-change-me-before-any-real-use}
  PORT: "8000"
  REDIS_URL: redis://glitchtip-redis:6379/0
  GLITCHTIP_DOMAIN: http://localhost:8888
  DEFAULT_FROM_EMAIL: dev@localhost
  EMAIL_URL: consolemail://          # dev: "emails" (invites, alerts) print to the worker log
  CELERY_WORKER_AUTOSCALE: "1,3"
  CELERY_WORKER_MAX_TASKS_PER_CHILD: "10000"

services:
  glitchtip-postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
      POSTGRES_DB: glitchtip
    volumes:
      - gt-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U glitchtip -d glitchtip"]
      interval: 5s
      timeout: 5s
      retries: 10

  glitchtip-redis:
    image: redis:7
    volumes:
      - gt-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot schema migration; the web/worker wait for it to finish successfully.
  glitchtip-migrate:
    image: glitchtip/glitchtip
    command: ["./manage.py", "migrate"]
    environment: *gt-env
    depends_on:
      glitchtip-postgres:
        condition: service_healthy

  glitchtip-web:
    image: glitchtip/glitchtip
    environment: *gt-env
    ports:
      - "8888:8000"
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
      glitchtip-redis:
        condition: service_healthy

  glitchtip-worker:
    image: glitchtip/glitchtip
    command: ["./bin/run-celery-with-beat.sh"]
    environment: *gt-env
    depends_on:
      glitchtip-migrate:
        condition: service_completed_successfully
      glitchtip-redis:
        condition: service_healthy

volumes:
  gt-pgdata:
  gt-redisdata:
