name: growth-operator-dev

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: growth_operator
      POSTGRES_PASSWORD: growth_operator
      POSTGRES_DB: growth_operator
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      # Creates the non-superuser app_rw role on a FRESH volume (MVP-016). For an existing
      # volume, run `make db-roles` (idempotent) instead — initdb scripts only run once.
      - ../db/roles.sql:/docker-entrypoint-initdb.d/10-roles.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U growth_operator -d growth_operator"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
    command: ["uvicorn", "core.api.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    volumes:
      - ../../core:/app/core
    ports:
      - "8000:8000"
    environment:
      # Runtime uses the non-superuser app_rw role so RLS is enforced (MVP-016).
      GROWTH_OPERATOR_DATABASE_URL: postgresql+asyncpg://app_rw:app_rw@postgres:5432/growth_operator
      # Migrations/alembic use the owner (DDL rights); app_rw has none.
      GROWTH_OPERATOR_DATABASE_MIGRATOR_URL: postgresql+asyncpg://growth_operator:growth_operator@postgres:5432/growth_operator
      GROWTH_OPERATOR_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
    command: ["python", "-m", "core.worker"]
    volumes:
      - ../../core:/app/core
    environment:
      # Runtime uses the non-superuser app_rw role so RLS is enforced (MVP-016).
      GROWTH_OPERATOR_DATABASE_URL: postgresql+asyncpg://app_rw:app_rw@postgres:5432/growth_operator
      # Migrations/alembic use the owner (DDL rights); app_rw has none.
      GROWTH_OPERATOR_DATABASE_MIGRATOR_URL: postgresql+asyncpg://growth_operator:growth_operator@postgres:5432/growth_operator
      GROWTH_OPERATOR_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.dev
    command: ["python", "-m", "core.scheduler"]
    volumes:
      - ../../core:/app/core
    environment:
      # Runtime uses the non-superuser app_rw role so RLS is enforced (MVP-016).
      GROWTH_OPERATOR_DATABASE_URL: postgresql+asyncpg://app_rw:app_rw@postgres:5432/growth_operator
      # Migrations/alembic use the owner (DDL rights); app_rw has none.
      GROWTH_OPERATOR_DATABASE_MIGRATOR_URL: postgresql+asyncpg://growth_operator:growth_operator@postgres:5432/growth_operator
      GROWTH_OPERATOR_REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
