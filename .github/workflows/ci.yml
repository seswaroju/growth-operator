name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  UV_VERSION: "0.5"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run mypy core
      - name: Architecture guards (MVP-010)
        run: uv run python scripts/guards.py

  # Secret scan (security-hardening S1, audit #16a): fail the build if a credential is ever
  # committed — over the FULL git history, not just the diff. Pinned gitleaks binary (no third-party
  # action) run with --redact so a finding never prints the secret value into CI logs.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # full history so the scan covers every commit, not just HEAD
      - name: Install gitleaks (pinned)
        run: |
          VERSION=8.30.1
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan history + tree for secrets
        run: gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --verbose

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - run: uv run pytest tests/unit -v

  migrate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: growth_operator
          POSTGRES_PASSWORD: growth_operator
          POSTGRES_DB: growth_operator
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U growth_operator -d growth_operator"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Redis for the runtime e2e (agent-run checkpoints + planner frequency cap). The install /
      # kirana e2e don't touch it, but the jewelry journey drives the real executor, which does.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GROWTH_OPERATOR_DATABASE_URL: postgresql+asyncpg://growth_operator:growth_operator@localhost:5432/growth_operator
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      # The app_rw role + its DEFAULT PRIVILEGES must exist BEFORE migrations run: later
      # migrations REVOKE/GRANT on app_rw (e.g. 006 audit_log), and app_rw needs the default
      # grants on every migration-created table. roles.sql is idempotent and guards its own
      # audit_log REVOKE with IF EXISTS, so it is safe to run first (mirrors `make bootstrap`).
      - name: Create app_rw runtime role
        run: psql "postgresql://growth_operator:growth_operator@localhost:5432/growth_operator" -f infra/db/roles.sql
      - run: uv run alembic upgrade head
      # Prove a backup actually restores (security S3, audit #16e): dump the freshly-migrated DB,
      # restore into a scratch DB, verify table count + alembic head + row-count match. The drill
      # only touches its own scratch DB, so it leaves the main DB intact for the e2e step below.
      - name: Restore drill (S3 — backups must restore)
        env:
          GROWTH_OPERATOR_DATABASE_MIGRATOR_URL: postgresql://growth_operator:growth_operator@localhost:5432/growth_operator
        run: bash scripts/db_restore_drill.sh
      # End-to-end gate (A3, ≈MVP-097): the full tests/e2e suite runs as the runtime role `app_rw`.
      # The jewelry journey drives the REAL runtime (webhook → normalizer → planner → concierge →
      # catalog.search → pricing.compute → park → approve → gated send → order → ROI/attribution),
      # so A1/A2 are now gated in CI, not just locally. Redis is provided above.
      - name: End-to-end suite — install · kirana dry-run · jewelry journey (front→middle→tail)
        env:
          GROWTH_OPERATOR_DATABASE_URL: postgresql+asyncpg://app_rw:app_rw@localhost:5432/growth_operator
          GROWTH_OPERATOR_DATABASE_MIGRATOR_URL: postgresql+asyncpg://growth_operator:growth_operator@localhost:5432/growth_operator
          GROWTH_OPERATOR_REDIS_URL: redis://localhost:6379/0
        run: uv run pytest tests/e2e -v

  # Placeholder — fails the build once real isolation tests exist and are skipped.
  # Wired for real in MVP-097 (isolation suite + nightly synthetic e2e).
  isolation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: ${{ env.UV_VERSION }}
      - run: uv sync --frozen
      - name: Fail if isolation suite is missing
        run: |
          if [ -z "$(find tests/isolation -name 'test_*.py' 2>/dev/null)" ]; then
            echo "::error::tests/isolation has no tests yet — expected until MVP-097 lands. Placeholder passes until then."
          fi

  # Placeholder — fails the build once real eval suites exist and are skipped.
  # Wired for real in MVP-095/MVP-096 (eval harness + CI gates).
  evals:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: echo "eval harness not wired yet — see MVP-095/MVP-096"
