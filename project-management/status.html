    --done:#56C38E;--done-wash:#16281F;--partial:#E0A93A;--partial-wash:#2C2411;--notstarted:#9B917A;--notstarted-wash:#23201A;
    --blocked:#E4694E;--blocked-wash:#2E1A14;--deferred:#6C6656;--deferred-wash:#201E18;--uncertain:#A394DA;--uncertain-wash:#201C2C;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font-family: var(--sans);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    font-size: 15px;
  }
  a { color: var(--accent); }
  .tnum { font-variant-numeric: tabular-nums; }
  .mono { font-family: var(--mono); }

  /* ---------- Header ---------- */
  header.top {
    padding: 26px clamp(16px, 4vw, 40px) 20px;
    border-bottom: 1px solid var(--border);
    background: linear-gradient(180deg, var(--surface) 0%, var(--ground) 100%);
  }
  .eyebrow {
    font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase;
    color: var(--accent); font-weight: 600; margin: 0 0 6px;
  }
  h1.title { margin: 0; font-size: clamp(22px, 3.4vw, 30px); font-weight: 680; letter-spacing: -.01em; text-wrap: balance; }
  .sub { margin: 8px 0 0; color: var(--ink-soft); max-width: 74ch; font-size: 14px; }
  .metaline { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 12px; color: var(--ink-faint); }
  .metaline .mono { color: var(--ink-soft); }

  /* ---------- Meters ---------- */
  .meters { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 14px; margin-top: 20px; }
  .meter {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 14px 16px; box-shadow: var(--shadow);
  }
  .meter.wedge { border-color: var(--accent-soft); }
  .meter h3 { margin: 0; font-size: 12.5px; letter-spacing: .04em; text-transform: uppercase; color: var(--ink-soft); font-weight: 600; display:flex; align-items:baseline; gap:8px; }
  .meter .pct { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin: 6px 0 2px; }
  .meter.wedge .pct { color: var(--accent); }
  .meter .track { height: 8px; border-radius: 99px; background: var(--surface-2); overflow: hidden; margin-top: 6px; }
  .meter .fill { height: 100%; border-radius: 99px; background: var(--notstarted); transition: width .5s cubic-bezier(.2,.7,.3,1); }
  .meter.wedge .fill { background: linear-gradient(90deg, var(--accent), var(--accent-soft)); }
  .meter.val .fill { background: var(--uncertain); }
  .meter .breakdown { margin-top: 9px; font-size: 11.5px; color: var(--ink-faint); display: flex; flex-wrap: wrap; gap: 4px 10px; }
  .meter .tag { font-weight: 600; }

  /* ---------- Toolbar ---------- */
  .toolbar {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    padding: 12px clamp(16px, 4vw, 40px);
    border-bottom: 1px solid var(--border); background: var(--ground);
    position: sticky; top: 0; z-index: 20;
  }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: center; }
  .legend .li { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--ink-soft); }
  .dot { width: 9px; height: 9px; border-radius: 3px; flex: none; }
  .spacer { flex: 1 1 auto; }
  .btn {
    font: inherit; font-size: 12.5px; cursor: pointer; color: var(--ink);
    background: var(--surface); border: 1px solid var(--border-strong); border-radius: 7px;
    padding: 6px 11px; display: inline-flex; align-items: center; gap: 6px;
  }
  .btn:hover { border-color: var(--accent-soft); }
  .btn[aria-pressed="true"] { background: var(--accent-wash); border-color: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .btn:focus-visible, .node:focus-visible { outline: 2px solid var(--accent-soft); outline-offset: 2px; }

  /* ---------- Layout ---------- */
  .app { display: grid; grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); gap: 0; align-items: start; }
  .tree-wrap { padding: 14px clamp(12px, 2.5vw, 24px) 60px; min-height: 60vh; }
  .detail-wrap { position: sticky; top: 52px; height: calc(100vh - 52px); overflow: auto; border-left: 1px solid var(--border); background: var(--surface); }

  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .detail-wrap { position: fixed; inset: auto 0 0 0; top: auto; height: 74vh; z-index: 40;
      transform: translateY(101%); transition: transform .28s cubic-bezier(.2,.7,.3,1);
      border-left: none; border-top: 1px solid var(--border-strong); border-radius: 16px 16px 0 0;
      box-shadow: 0 -12px 40px rgba(0,0,0,.28); }
    .detail-wrap.open { transform: translateY(0); }
  }

  /* ---------- Tree ---------- */
  .track-group { margin-bottom: 20px; }
  .track-head { display: flex; align-items: center; gap: 10px; padding: 4px 6px 8px; }
  .track-head .name { font-size: 13px; letter-spacing: .06em; text-transform: uppercase; font-weight: 700; color: var(--ink-soft); }
  .track-head .rollup { font-size: 12px; color: var(--ink-faint); }

  ul.tree, ul.tree ul { list-style: none; margin: 0; padding: 0; }
  ul.tree ul { margin-left: 15px; border-left: 1px dashed var(--border-strong); padding-left: 4px; }
  li.row { margin: 2px 0; }

  .node {
    display: grid; grid-template-columns: 20px 6px 1fr auto; align-items: center; gap: 8px;
    width: 100%; text-align: left; font: inherit; cursor: pointer;
    background: transparent; border: 1px solid transparent; border-radius: 8px;
    padding: 7px 9px 7px 4px; color: var(--ink);
  }
  .node:hover { background: var(--surface-2); }
  .node.selected { background: var(--accent-wash); border-color: var(--accent-soft); }
  .node.selected .nname { color: var(--ink); }
  .caret { width: 20px; height: 20px; display: inline-flex; align-items: center; justify-content: center; color: var(--ink-faint); transition: transform .16s ease; flex: none; }
  .caret.open { transform: rotate(90deg); }
  .caret.leaf { visibility: hidden; }
  .stripe { width: 5px; height: 22px; border-radius: 99px; align-self: center; }
  .nlabel { min-width: 0; }
  .nname { font-size: 14px; font-weight: 550; line-height: 1.3; overflow: hidden; text-overflow: ellipsis; }
  .nid { font-size: 10.5px; color: var(--ink-faint); font-family: var(--mono); }
  .nmiss { font-size: 12px; color: var(--ink-soft); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nmiss b { color: var(--blocked); font-weight: 600; }
  .right { display: flex; align-items: center; gap: 8px; flex: none; }

  .chip { font-size: 10.5px; font-weight: 650; letter-spacing: .03em; text-transform: uppercase; padding: 2px 7px; border-radius: 99px; white-space: nowrap; }
  .pctbadge { font-size: 12px; font-weight: 700; color: var(--ink-soft); min-width: 34px; text-align: right; }

  .st-done      { color: var(--done); }        .bg-done      { background: var(--done-wash); color: var(--done); }
  .st-partial   { color: var(--partial); }      .bg-partial   { background: var(--partial-wash); color: var(--partial); }
  .st-notstarted{ color: var(--notstarted); }   .bg-notstarted{ background: var(--notstarted-wash); color: var(--notstarted); }
  .st-blocked   { color: var(--blocked); }       .bg-blocked   { background: var(--blocked-wash); color: var(--blocked); }
  .st-deferred  { color: var(--deferred); }      .bg-deferred  { background: var(--deferred-wash); color: var(--deferred); }
  .st-uncertain { color: var(--uncertain); }     .bg-uncertain { background: var(--uncertain-wash); color: var(--uncertain); }

  .fill-done{background:var(--done);} .fill-partial{background:var(--partial);} .fill-notstarted{background:var(--notstarted);}
  .fill-blocked{background:var(--blocked);} .fill-deferred{background:var(--deferred);} .fill-uncertain{background:var(--uncertain);}

  li.deferred > .node .nname { color: var(--ink-faint); }
  li.deferred > .node { opacity: .72; }

  li.hidden-gap { display: none; }

  /* ---------- Detail panel ---------- */
  .detail { padding: 22px clamp(16px, 2.4vw, 26px) 60px; }
  .detail .close { display: none; }
  @media (max-width: 860px) { .detail .close { display: inline-flex; } }
  .d-empty { color: var(--ink-faint); font-size: 14px; padding: 40px 6px; text-align: center; }
  .d-eyebrow { font-family: var(--mono); font-size: 11px; color: var(--ink-faint); letter-spacing: .04em; }
  .d-title { font-size: 20px; font-weight: 680; margin: 6px 0 12px; letter-spacing: -.01em; text-wrap: balance; line-height: 1.25; }
  .d-status-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .d-rollup { font-size: 12.5px; color: var(--ink-soft); }
  .d-rollup b { color: var(--ink); font-variant-numeric: tabular-nums; }

  .block { margin: 0 0 14px; border-radius: 10px; }
  .block h4 { margin: 0 0 6px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--ink-faint); font-weight: 700; }
  .block p { margin: 0; font-size: 14px; color: var(--ink); }

  .miss {
    background: var(--blocked-wash); border: 1px solid color-mix(in srgb, var(--blocked) 32%, transparent);
    padding: 14px 15px; border-radius: 11px; margin: 4px 0 16px;
  }
  .miss h4 { color: var(--blocked); }
  .miss p { color: var(--ink); font-size: 14.5px; }
  .miss ul { margin: 2px 0 0; padding-left: 18px; }
  .miss li { color: var(--ink); font-size: 14px; margin: 5px 0; padding-left: 2px; }
  .miss li::marker { color: var(--blocked); }
  .tickets { display: flex; flex-wrap: wrap; gap: 6px; }
  .ticket { font-size: 12px; font-family: var(--mono); background: var(--accent-wash); border: 1px solid var(--accent-soft); color: var(--accent); border-radius: 6px; padding: 3px 8px; font-weight: 600; }

  .next {
    background: var(--accent-wash); border: 1px solid var(--accent-soft);
    padding: 13px 15px; border-radius: 11px; margin: 4px 0 16px;
  }
  .next h4 { color: var(--accent); }
  .next p { font-size: 14.5px; font-weight: 520; }

  .evi { list-style: none; margin: 4px 0 0; padding: 0; display: flex; flex-direction: column; gap: 4px; }
  .evi li { font-family: var(--mono); font-size: 12px; color: var(--ink-soft); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 4px 8px; word-break: break-all; }
  .deps { display: flex; flex-wrap: wrap; gap: 6px; }
  .dep { font-size: 12px; font-family: var(--mono); background: var(--surface-2); border: 1px solid var(--border); border-radius: 6px; padding: 3px 8px; color: var(--ink-soft); }
  .notes { font-size: 13px; color: var(--ink-soft); font-style: italic; }
  .src-badge { font-size: 11px; color: var(--ink-faint); font-family: var(--mono); }
  .backdrop { display:none; }
  @media (max-width:860px){ .backdrop.show{ display:block; position:fixed; inset:0; background:rgba(20,16,8,.4); z-index:35; } }
</style>

<header class="top">
  <p class="eyebrow">Growth Operator · Wedge Build Status</p>
  <h1 class="title" id="h-title">Ghost-recovery wedge — what exists, what's missing</h1>
  <p class="sub" id="h-sub"></p>
  <div class="metaline" id="h-meta"></div>
  <div class="meters" id="meters"></div>
</header>

<div class="toolbar">
  <div class="legend" id="legend"></div>
  <div class="spacer"></div>
  <button class="btn" id="btn-gaps" aria-pressed="false" title="Hide DONE / DEFERRED; show only open work">Gaps only</button>
  <button class="btn" id="btn-expand">Expand all</button>
  <button class="btn" id="btn-collapse">Collapse</button>
  <button class="btn" id="btn-theme" title="Toggle light / dark">◐ Theme</button>
</div>

<div class="app">
  <main class="tree-wrap"><div id="tree"></div></main>
  <aside class="detail-wrap" id="detail-wrap">
    <div class="detail" id="detail">
      <div class="d-empty">Select any component on the left to see its status, the gap, and the next action.</div>
    </div>
  </aside>
</div>
<div class="backdrop" id="backdrop"></div>

<script>
(function () {
  "use strict";

  var STATUS_META = {
    DONE:       { cls: "done",       label: "Done" },
    PARTIAL:    { cls: "partial",    label: "Partial" },
    NOT_STARTED:{ cls: "notstarted", label: "Not started" },
    BLOCKED:    { cls: "blocked",    label: "Blocked" },
    DEFERRED:   { cls: "deferred",   label: "Deferred" },
    UNCERTAIN:  { cls: "uncertain",  label: "Uncertain" }
  };
  var SCORE = { DONE: 1, PARTIAL: 0.5, NOT_STARTED: 0, BLOCKED: 0, UNCERTAIN: 0 };

  var state = { data: null, byId: {}, selected: null, gapsOnly: false, source: "embedded snapshot" };

  function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, function(c){
    return { "&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;" }[c]; }); }

  function isDeferred(node){ return node.status === "DEFERRED"; }

  // what_is_missing may be a string or an array of strings.
  function missToText(m){ return Array.isArray(m) ? m.join(" · ") : (m || ""); }
  function missToHtml(m){
    if (Array.isArray(m)) return '<ul>'+m.map(function(x){ return '<li>'+esc(x)+'</li>'; }).join('')+'</ul>';
    return '<p>'+esc(m)+'</p>';
  }

  // Roll up: returns {num, den, leaves} counting only non-deferred leaves.
  function rollup(node){
    if (!node.children || !node.children.length){
      if (isDeferred(node)) return { num:0, den:0 };
      return { num: SCORE[node.status] != null ? SCORE[node.status] : 0, den: 1 };
    }
    var num = 0, den = 0;
    node.children.forEach(function(c){ var r = rollup(c); num += r.num; den += r.den; });
    return { num: num, den: den };
  }
  function pctOf(node){ var r = rollup(node); return r.den ? Math.round(100 * r.num / r.den) : null; }

  function countStatuses(node, acc){
    acc = acc || {};
    function walk(n){
      if (!n.children || !n.children.length){ acc[n.status] = (acc[n.status]||0)+1; }
      else n.children.forEach(walk);
    }
    walk(node);
    return acc;
  }

  function index(node){ if(node.id) state.byId[node.id]=node; (node.children||[]).forEach(index); }

  /* ---------------- Header + meters ---------------- */
  function renderHeader(){
    var m = state.data.meta || {};
    document.getElementById("h-sub").textContent = m.wedge || "";
    var meta = document.getElementById("h-meta");
    meta.innerHTML =
      '<span>Generated <span class="mono">'+esc(m.generated||"—")+'</span></span>'+
      '<span>Source <span class="mono">'+esc(m.source_commit||"—")+'</span></span>'+
      '<span class="src-badge" id="src-badge">data: '+esc(state.source)+'</span>';
  }

  function meterCard(cls, title, node, note){
    var pct = pctOf(node);
    var counts = countStatuses(node);
    var parts = [];
    ["DONE","PARTIAL","NOT_STARTED","BLOCKED","UNCERTAIN"].forEach(function(s){
      if (counts[s]) parts.push('<span class="tag st-'+STATUS_META[s].cls+'">'+counts[s]+' '+STATUS_META[s].label+'</span>');
    });
    return '<div class="meter '+cls+'">'+
      '<h3>'+esc(title)+'</h3>'+
      '<div class="pct tnum">'+(pct==null?"—":pct+'%')+'</div>'+
      '<div class="track"><div class="fill" style="width:'+(pct==null?0:pct)+'%"></div></div>'+
      '<div class="breakdown">'+(parts.join('') || '<span>'+esc(note||"")+'</span>')+'</div>'+
      '</div>';
  }

  function renderMeters(){
    var tracks = {};
    state.data.tracks.forEach(function(t){ tracks[t.track] = t; });
    var html = "";
    if (tracks.wedge)       html += meterCard("wedge", "Core Wedge (MVP)", tracks.wedge);
    if (tracks.foundations) html += meterCard("found", "Foundations", tracks.foundations);
    if (tracks.identity)    html += meterCard("found", "Access & Identity", tracks.identity);
    if (tracks.validation)  html += meterCard("val", "Validation / Evidence", tracks.validation);
    if (tracks.deferred){
      var n = (tracks.deferred.children||[]).length;
      html += '<div class="meter" style="opacity:.72"><h3>Deferred</h3>'+
        '<div class="pct tnum" style="color:var(--deferred)">'+n+'</div>'+
        '<div class="track"><div class="fill fill-deferred" style="width:100%"></div></div>'+
        '<div class="breakdown"><span>Out of MVP scope · excluded from all %</span></div></div>';
    }
    document.getElementById("meters").innerHTML = html;
  }

  function renderLegend(){
    var order = ["DONE","PARTIAL","NOT_STARTED","BLOCKED","UNCERTAIN","DEFERRED"];
    document.getElementById("legend").innerHTML = order.map(function(s){
      return '<span class="li"><span class="dot fill-'+STATUS_META[s].cls+'"></span>'+STATUS_META[s].label+'</span>';
    }).join('');
  }

  /* ---------------- Tree ---------------- */
  function chip(status){
    var meta = STATUS_META[status] || { cls:"notstarted", label:status };
    return '<span class="chip bg-'+meta.cls+'">'+esc(meta.label)+'</span>';
  }

  function nodeRow(node, depth){
    var hasKids = node.children && node.children.length;
    var meta = STATUS_META[node.status] || STATUS_META.NOT_STARTED;
    var pct = hasKids ? pctOf(node) : null;
    var right = hasKids
      ? (pct==null ? '<span class="pctbadge tnum">—</span>' : '<span class="pctbadge tnum">'+pct+'%</span>')
      : chip(node.status);

    var missPreview = (!hasKids && node.what_is_missing && node.status!=="DONE" && node.status!=="DEFERRED")
      ? '<div class="nmiss"><b>Missing:</b> '+esc(missToText(node.what_is_missing))+'</div>' : '';

    var caretCls = hasKids ? "caret" + (depth < 1 ? " open" : "") : "caret leaf";
    var openByDefault = depth < 1;

    var li = document.createElement("li");
    li.className = "row" + (isDeferred(node) ? " deferred" : "");
    li.dataset.status = node.status;
    li.dataset.leaf = hasKids ? "0" : "1";

    var btn = document.createElement("button");
    btn.className = "node";
    btn.type = "button";
    btn.setAttribute("aria-expanded", hasKids ? String(openByDefault) : "false");
    btn.innerHTML =
      '<span class="'+caretCls+'" aria-hidden="true">'+(hasKids ?
        '<svg width="12" height="12" viewBox="0 0 12 12"><path d="M4 2l4 4-4 4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>' : '')+'</span>'+
      '<span class="stripe fill-'+meta.cls+'"></span>'+
      '<span class="nlabel"><span class="nname">'+esc(node.name)+'</span> <span class="nid">'+esc(node.id||"")+'</span>'+missPreview+'</span>'+
      '<span class="right">'+right+'</span>';

    btn.addEventListener("click", function(e){
      if (hasKids && !e.altKey){
        var open = btn.getAttribute("aria-expanded") === "true";
        setOpen(li, btn, !open);
      }
      select(node.id);
    });
    li.appendChild(btn);

    if (hasKids){
      var ul = document.createElement("ul");
      node.children.forEach(function(c){ ul.appendChild(nodeRow(c, depth+1)); });
      if (!openByDefault) ul.style.display = "none";
      li.appendChild(ul);
    }
    return li;
  }

  function setOpen(li, btn, open){
    var ul = li.querySelector(":scope > ul");
    var caret = btn.querySelector(".caret");
    if (!ul) return;
    ul.style.display = open ? "" : "none";
    btn.setAttribute("aria-expanded", String(open));
    if (caret) caret.classList.toggle("open", open);
  }

  function renderTree(){
    var root = document.getElementById("tree");
    root.innerHTML = "";
    state.data.tracks.forEach(function(track){
      var grp = document.createElement("div");
      grp.className = "track-group";
      var pct = pctOf(track);
      var head = document.createElement("div");
      head.className = "track-head";
      head.innerHTML = '<span class="stripe fill-'+(STATUS_META[track.status]||STATUS_META.NOT_STARTED).cls+'"></span>'+
        '<span class="name">'+esc(track.name)+'</span>'+
        '<span class="rollup tnum">'+(track.track==="deferred" ? "out of scope" : (pct==null?"—":pct+"% complete"))+'</span>';
      grp.appendChild(head);
      var ul = document.createElement("ul");
      ul.className = "tree";
      (track.children||[]).forEach(function(c){ ul.appendChild(nodeRow(c, 0)); });
      grp.appendChild(ul);
      root.appendChild(grp);
    });
    applyGaps();
  }

  /* ---------------- Detail ---------------- */
  function block(title, html){ return '<div class="block"><h4>'+esc(title)+'</h4>'+html+'</div>'; }

  function select(id){
    var node = state.byId[id];
    if (!node) return;
    state.selected = id;
    document.querySelectorAll(".node.selected").forEach(function(n){ n.classList.remove("selected"); });
    // find the button for this node
    var buttons = document.querySelectorAll(".node");
    buttons.forEach(function(b){
      var nid = b.querySelector(".nid");
      if (nid && nid.textContent === id) b.classList.add("selected");
    });

    var hasKids = node.children && node.children.length;
    var meta = STATUS_META[node.status] || STATUS_META.NOT_STARTED;
    var pct = pctOf(node);
    var r = rollup(node);
    var html = '';
    html += '<button class="btn close" id="d-close" style="float:right">✕ Close</button>';
    html += '<div class="d-eyebrow">'+esc(node.id||"")+'</div>';
    html += '<div class="d-title">'+esc(node.name)+'</div>';
    html += '<div class="d-status-row">'+chip(node.status);
    if (hasKids && pct != null){
      html += '<span class="d-rollup">Rollup <b>'+pct+'%</b> · '+r.num+' / '+r.den+' non-deferred leaves</span>';
    }
    html += '</div>';

    if (node.what_is_missing){
      html += '<div class="miss"><h4>What’s missing</h4>'+missToHtml(node.what_is_missing)+'</div>';
    }
    if (node.next_action){
      html += '<div class="next"><h4>Next action</h4><p>'+esc(node.next_action)+'</p></div>';
    }
    if (node.tickets && node.tickets.length){
      html += block("Tickets", '<div class="tickets">'+node.tickets.map(function(t){ return '<span class="ticket">'+esc(t)+'</span>'; }).join('')+'</div>');
    }
    if (node.what_exists){
      html += block("What exists", '<p>'+esc(node.what_exists)+'</p>');
    }
    if (node.evidence && node.evidence.length){
      html += block("Evidence (in the repo)", '<ul class="evi">'+node.evidence.map(function(e){ return '<li>'+esc(e)+'</li>'; }).join('')+'</ul>');
    }
    if (node.spec_refs && node.spec_refs.length){
      html += block("Vault spec references", '<ul class="evi">'+node.spec_refs.map(function(e){ return '<li>'+esc(e)+'</li>'; }).join('')+'</ul>');
    }
    if (node.dependencies && node.dependencies.length){
      html += block("Dependencies", '<div class="deps">'+node.dependencies.map(function(d){ return '<span class="dep">'+esc(d)+'</span>'; }).join('')+'</div>');
    }
    if (node.notes){
      html += block("Notes", '<p class="notes">'+esc(node.notes)+'</p>');
    }

    var d = document.getElementById("detail");
    d.innerHTML = html;
    document.getElementById("detail-wrap").classList.add("open");
    document.getElementById("backdrop").classList.add("show");
    var close = document.getElementById("d-close");
    if (close) close.addEventListener("click", closeDetail);
    if (window.matchMedia("(max-width:860px)").matches) d.scrollTop = 0;
  }
  function closeDetail(){
    document.getElementById("detail-wrap").classList.remove("open");
    document.getElementById("backdrop").classList.remove("show");
  }

  /* ---------------- Gaps filter ---------------- */
  function applyGaps(){
    var on = state.gapsOnly;
    document.querySelectorAll("li.row").forEach(function(li){
      var leaf = li.dataset.leaf === "1";
      if (!on){ li.classList.remove("hidden-gap"); return; }
      if (leaf){
        var s = li.dataset.status;
        var keep = (s === "PARTIAL" || s === "NOT_STARTED" || s === "BLOCKED" || s === "UNCERTAIN");
        li.classList.toggle("hidden-gap", !keep);
      } else {
        li.classList.remove("hidden-gap");
      }
    });
    // hide parent branches whose every leaf got filtered out
    document.querySelectorAll("ul.tree > li.row").forEach(pruneEmpty);
  }
  function pruneEmpty(li){
    var childUl = li.querySelector(":scope > ul");
    if (!childUl) return;
    childUl.querySelectorAll(":scope > li.row").forEach(pruneEmpty);
    if (state.gapsOnly){
      var anyVisible = Array.prototype.some.call(childUl.children, function(c){ return !c.classList.contains("hidden-gap"); });
      if (!anyVisible && li.dataset.leaf === "0") li.classList.add("hidden-gap");
    }
  }

  function expandAll(open){
    document.querySelectorAll("li.row").forEach(function(li){
      var btn = li.querySelector(":scope > .node");
      if (btn && btn.getAttribute("aria-expanded") !== null && li.querySelector(":scope > ul")){
        setOpen(li, btn, open);
      }
    });
  }

  /* ---------------- Theme ---------------- */
  function toggleTheme(){
    var cur = document.documentElement.getAttribute("data-theme");
    var next = cur === "dark" ? "light" : (cur === "light" ? "dark" :
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "light" : "dark"));
    document.documentElement.setAttribute("data-theme", next);
  }

  /* ---------------- Boot ---------------- */
  function boot(data, source){
    state.data = data; state.source = source; state.byId = {};
    (data.tracks||[]).forEach(index);
    renderHeader(); renderMeters(); renderLegend(); renderTree();
  }

  document.getElementById("btn-gaps").addEventListener("click", function(){
    state.gapsOnly = !state.gapsOnly;
    this.setAttribute("aria-pressed", String(state.gapsOnly));
    if (state.gapsOnly) expandAll(true);
    applyGaps();
  });
  document.getElementById("btn-expand").addEventListener("click", function(){ expandAll(true); });
  document.getElementById("btn-collapse").addEventListener("click", function(){ expandAll(false); });
  document.getElementById("btn-theme").addEventListener("click", toggleTheme);
  document.getElementById("backdrop").addEventListener("click", closeDetail);

  // 1) embedded data (always works on file://)
  var embedded = JSON.parse(document.getElementById("embedded-status").textContent);
  boot(embedded, "embedded snapshot");

  // 2) try live status.json to override (works when served over http)
  try {
    fetch("status.json", { cache: "no-store" }).then(function(res){
      if (!res.ok) throw 0;
      return res.json();
    }).then(function(live){
      boot(live, "status.json (live)");
    }).catch(function(){ /* keep embedded */ });
  } catch (e) { /* file:// may throw synchronously; keep embedded */ }
})();
</script>
